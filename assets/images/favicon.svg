<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="quantGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C5CFF"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="22" fill="#0A0C14"/>
  <rect x="2" y="2" width="96" height="96" rx="20" fill="none" stroke="url(#quantGrad)" stroke-width="2" opacity="0.4"/>
  <!-- Sigma & Delta quant symbol -->
  <path d="M 30 28 L 70 28 L 50 50 L 70 72 L 30 72 L 35 64 L 54 64 L 42 50 L 54 36 L 35 36 Z" fill="url(#quantGrad)" filter="url(#glow)"/>
</svg>

